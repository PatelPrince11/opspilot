# OpsPilot front door: the built dashboard as static files, the API proxied to the app container.
# Plain HTTP on port 80 (HTTPS is a later step). The app and Postgres are not published.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;  # an /investigate body is a question of at most 2,000 chars

    root /usr/share/nginx/html;

    # API. X-Forwarded-For is overwritten with the real peer address, never appended to, so a
    # caller cannot pick its own rate-limit bucket by sending the header (uvicorn trusts it via
    # --proxy-headers).
    location ~ ^/(health|investigate|investigations/) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: forward each event as it is written, not when the run ends.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # agent_max_seconds is 300
        proxy_pass_header X-Accel-Buffering;  # also tells any proxy in front not to buffer
    }

    # Dashboard (single page): unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
