[project]
name = "opspilot"
version = "0.1.0"
description = "Incident-investigation agent with cited diagnoses (synthetic data)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: always print skip reasons, so skipped DB tests are never silent.
addopts = "-rs"
markers = ["db: needs Postgres on the host port (make up)"]
# Starlette prefers httpx2 but falls back to httpx with only a deprecation warning.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
