[project]
name = "opspilot"
version = "0.1.0"
description = "Incident-investigation agent with cited diagnoses (synthetic data)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: always print skip reasons, so skipped DB tests are never silent.
addopts = "-rs"
markers = ["db: needs Postgres on the host port (make up)"]
# Starlette prefers httpx2 but falls back to httpx with only a deprecation warning.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# pytest --cov (CI): line coverage of the agent and retrieval code, failing under 85%.
[tool.coverage.run]
source = ["rag", "agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# CPU-only torch on Linux (Docker, EC2); macOS wheels are CPU builds already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
