# LIVE-10: an inventory-service release raised its pool to 60 per pod; 2 x 60 = 120 exceeds
# inventory-db-01's 97 usable connections. SYNTHETIC, corpus 'live', own case only.
# Facts: inventory-db max_connections 100, superuser_reserved_connections 3; inventory-service
# pool 20 x 2 pods normally; 53300 means too_many_connections; INV-E220 reservation timeout;
# ORD-5003 is orders-api's downstream failure. Not RB-015's missing index.
date = 2026-10-13

[[burst]]
from = "09:30:00"
to = "10:00:00"
count = 6
service = "inventory-service"
level = "INFO"
hosts = ["inventory-service-01.prod.internal", "inventory-service-02.prod.internal"]
message = "reservation ok sku={int:10000-99999} took_ms={int:5-30}"

[[line]]
gold = true
at = "10:01:40"
service = "inventory-service"
host = "inventory-service-01.prod.internal"
level = "INFO"
message = "starting inventory-service: db pool max_conns=60"

[[line]]
gold = true
at = "10:03:15"
service = "inventory-service"
host = "inventory-service-02.prod.internal"
level = "INFO"
message = "starting inventory-service: db pool max_conns=60"

[[burst]]
gold = true
from = "10:05:00"
to = "10:25:00"
count = 14
service = "inventory-db"
level = "FATAL"
hosts = ["inventory-db-01.prod.internal"]
message = "FATAL: remaining connection slots are reserved for roles with the SUPERUSER attribute (SQLSTATE 53300)"

[[burst]]
gold = true
from = "10:05:00"
to = "10:25:00"
count = 12
service = "inventory-service"
level = "ERROR"
hosts = ["inventory-service-01.prod.internal", "inventory-service-02.prod.internal"]
message = "could not open database connection to inventory-db-01: remaining connection slots are reserved for roles with the SUPERUSER attribute (SQLSTATE 53300)"

[[burst]]
from = "10:06:00"
to = "10:25:00"
count = 10
service = "inventory-service"
level = "WARN"
hosts = ["inventory-service-01.prod.internal", "inventory-service-02.prod.internal"]
message = "INV-E220 stock reservation timed out sku={int:10000-99999}"

[[burst]]
from = "10:06:00"
to = "10:25:00"
count = 10
service = "orders-api"
level = "ERROR"
hosts = ["orders-api-01.prod.internal", "orders-api-02.prod.internal", "orders-api-03.prod.internal"]
message = "ORD-5003 checkout failed: inventory-service reservation timed out"
