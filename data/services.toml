# OpsPilot services: SYNTHETIC. A fictional payments / e-commerce company.
#
# Source of truth for the services table, the hosts that appear in logs, and the
# error codes that runbooks, incidents and logs may use. Hosts follow
# <service>-NN.prod.internal; each service owns one 10.0.<subnet>.0/24.
#
# status is the current snapshot that get_service_status returns. payments-api and
# payments-pgbouncer are degraded by the open demo incident (data/live/);
# search-api is degraded for an unrelated reason, as a distractor.

[meta]
company = "fictional"
domain = "prod.internal"
synthetic = true

# ---------------------------------------------------------------- applications

[[services]]
name = "edge-gateway"
kind = "app"
owner = "team-platform"
tech = "Envoy"
port = 443
status = "healthy"
dependencies = ["auth-service", "payments-api", "orders-api", "catalog-api", "search-api", "internal-dns"]
hosts = [
  { name = "edge-gateway-01.prod.internal", ip = "10.0.1.11" },
  { name = "edge-gateway-02.prod.internal", ip = "10.0.1.12" },
