# ----------------------------------------------------------------- error codes
# Standard tokens (service = "*") are real-world error strings any service may log.
# Internal codes are fictional and appear only in this corpus, which gives the eval
# exact-token questions that dense retrieval should find hard.

[[error_codes]]
code = "ECONNREFUSED"
service = "*"
meaning = "TCP connect refused: nothing listening on the target host:port"

[[error_codes]]
code = "ETIMEDOUT"
service = "*"
meaning = "TCP connect or read timed out"

[[error_codes]]
code = "ENOSPC"
service = "*"
meaning = "No space left on device"

[[error_codes]]
code = "EMFILE"
service = "*"
meaning = "Too many open files (process file-descriptor limit)"

[[error_codes]]
code = "53300"
service = "*"
meaning = "Postgres SQLSTATE too_many_connections"

[[error_codes]]
code = "57P01"
service = "*"
meaning = "Postgres SQLSTATE admin_shutdown (server terminated the connection)"

[[error_codes]]
code = "57P02"
service = "*"
meaning = "Postgres SQLSTATE crash_shutdown (another server process crashed; sessions terminated)"

[[error_codes]]
code = "SERVFAIL"
service = "*"
meaning = "DNS server failed to answer"

[[error_codes]]
code = "NXDOMAIN"
service = "*"
meaning = "DNS name does not exist"

[[error_codes]]
code = "x509: certificate has expired"
service = "*"
meaning = "TLS handshake failed: peer certificate past its notAfter date"

[[error_codes]]
code = "429"
service = "*"
meaning = "HTTP Too Many Requests"

[[error_codes]]
code = "502"
service = "*"
meaning = "HTTP Bad Gateway"

[[error_codes]]
code = "503"
service = "*"
meaning = "HTTP Service Unavailable"

[[error_codes]]
code = "504"
service = "*"
meaning = "HTTP Gateway Timeout"

[[error_codes]]
code = "OOMKilled"
service = "*"
meaning = "Container killed by the kernel OOM killer (exit code 137)"

[[error_codes]]
code = "MISCONF"
service = "*"
meaning = "Redis refuses writes because RDB snapshotting failed"

[[error_codes]]
code = "LOADING"
service = "*"
meaning = "Redis is loading its dataset into memory and rejects commands"

[[error_codes]]
code = "query_wait_timeout"
service = "*"
meaning = "PgBouncer disconnected a client whose query waited longer than query_wait_timeout for a server connection"

[[error_codes]]
code = "READONLY"
service = "*"
meaning = "Redis rejected a write sent to a replica (READONLY You can't write against a read only replica.)"

[[error_codes]]
code = "OOM command not allowed"
service = "*"
meaning = "Redis rejected a write because used memory is above maxmemory and the policy cannot evict"

[[error_codes]]
code = "PAYAPI-E1042"
service = "payments-api"
meaning = "Could not acquire a database connection from the pgx pool before the DB_ACQUIRE_TIMEOUT context deadline (an app setting, not a pgxpool one); handler returns 503"

[[error_codes]]
code = "PAYAPI-E1107"
service = "payments-api"
meaning = "Card processor call failed after retries"

[[error_codes]]
code = "PAYAPI-W0310"
service = "payments-api"
meaning = "Fraud score unavailable or not returned in time; fell back to the static rules"

[[error_codes]]
code = "LEDGER-W210"
service = "ledger-service"
meaning = "HikariCP pool near capacity (active connections above 90%)"

[[error_codes]]
code = "LEDGER-E455"
service = "ledger-service"
meaning = "Kafka publish of a ledger entry failed and was queued for retry"

[[error_codes]]
code = "ORD-5003"
service = "orders-api"
meaning = "Checkout failed because a call to a downstream dependency failed or timed out from orders-api's side (the dependency itself may be healthy)"

[[error_codes]]
code = "INV-E220"
service = "inventory-service"
meaning = "Stock reservation timed out"

[[error_codes]]
code = "AUTH-E401X"
service = "auth-service"
meaning = "Session lookup failed; user forced to log in again"

[[error_codes]]
code = "CPX-E600"
service = "card-processor-proxy"
meaning = "Upstream TLS handshake with the card processor failed"

[[error_codes]]
code = "CPX-W429"
service = "card-processor-proxy"
meaning = "Card processor rate limit hit; request delayed or rejected"

[[error_codes]]
code = "FRD-W118"
service = "fraud-scorer"
meaning = "Feature fetch from redis-features exceeded its latency budget"

[[error_codes]]
code = "FRD-E140"
service = "fraud-scorer"
meaning = "Velocity-counter write to redis-features rejected; counters stale until writes recover"

[[error_codes]]
code = "CAT-E301"
service = "catalog-api"
meaning = "Cache miss storm: cache unavailable, reading through to catalog-db"

[[error_codes]]
code = "SRCH-E502"
service = "search-api"
meaning = "search-cluster query rejected (thread pool queue full)"

[[error_codes]]
code = "EDGE-RL01"
service = "edge-gateway"
meaning = "Request rejected by the gateway's own rate limiter (local_rate_limit)"

[[error_codes]]
code = "NTF-E710"
service = "notification-worker"
meaning = "Consumer lag above threshold on the notifications topic"
