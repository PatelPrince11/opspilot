# Synthetic logs for INC-0070. Our own services' formats; ENOSPC is the errno name.
[[line]]
at = "02:30:05"
service = "kafka"
host = "kafka-02.prod.internal"
level = "ERROR"
message = "alert fired: /var usage above 90% on kafka-02"

[[line]]
at = "03:15:40"
service = "kafka"
host = "kafka-02.prod.internal"
level = "INFO"
message = "logrotate: forced rotation of /var/log/kafka"

[[line]]
at = "03:45:00"
service = "kafka"
host = "kafka-02.prod.internal"
level = "INFO"
message = "disk check: /var back under 80%"

[[burst]]
from = "02:30:10"
to = "03:14:50"
count = 25
service = "kafka"
level = "ERROR"
hosts = ["kafka-02.prod.internal"]
message = "gc log: write under /var/log/kafka failed: no space left on device (ENOSPC)"

[[burst]]
from = "02:20:00"
to = "02:29:50"
count = 10
service = "kafka"
level = "WARN"
hosts = ["kafka-02.prod.internal"]
message = "disk check: /var at {int:82-89}%"

[[burst]]
from = "03:20:00"
to = "03:44:00"
count = 10
service = "kafka"
level = "INFO"
hosts = ["kafka-02.prod.internal"]
message = "gc log: wrote {int:1-9} entries to /var/log/kafka"
