# Synthetic logs for INC-0083. Pool ceiling 40 per pod; E1042 starts after the pool is full.
[[burst]]
from = "10:50:00"
to = "10:59:59"
count = 6
service = "payments-api"
level = "INFO"
hosts = ["payments-api-01.prod.internal", "payments-api-03.prod.internal"]
message = "db pool acquired {int:8-15} of 40 connections"

