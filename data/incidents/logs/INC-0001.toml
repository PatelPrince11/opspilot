# Synthetic logs for INC-0001. Fictional log-agent and disk-monitor lines only; the agent ships
# its own errors over the network (NOTES fact). No real journald text used.
[[burst]]
from = "21:15:00"
to = "21:24:30"
count = 6
service = "catalog-db"
level = "WARN"
hosts = ["catalog-db-01.prod.internal"]
message = "disk-monitor: /var usage {ramp:97-99}%"

[[burst]]
from = "21:25:00"
to = "21:51:50"
count = 22
service = "catalog-db"
level = "ERROR"
hosts = ["catalog-db-01.prod.internal"]
message = "log-agent: cannot save read position under /var/lib/log-agent: ENOSPC"

[[burst]]
from = "21:25:10"
to = "21:51:40"
count = 6
service = "catalog-db"
level = "WARN"
hosts = ["catalog-db-01.prod.internal"]
message = "log-agent: local buffer holding {ramp:120-2400} unsent lines"

[[line]]
at = "21:52:30"
service = "catalog-db"
host = "catalog-db-01.prod.internal"
level = "INFO"
message = "log-agent: position writes resumed"

[[burst]]
from = "21:53:00"
to = "22:40:00"
count = 8
service = "catalog-db"
level = "INFO"
hosts = ["catalog-db-01.prod.internal"]
message = "log-agent: backlog {ramp:10-100}% shipped"

[[line]]
at = "22:10:40"
service = "catalog-db"
host = "catalog-db-01.prod.internal"
level = "INFO"
message = "ops: journald.conf updated (SystemMaxUse=500M), systemd-journald restarted"

[[burst]]
from = "22:00:00"
to = "23:20:00"
count = 12
service = "catalog-db"
level = "INFO"
hosts = ["catalog-db-01.prod.internal"]
message = "disk-monitor: /var usage steady"
