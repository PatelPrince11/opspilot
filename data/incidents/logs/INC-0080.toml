# Synthetic logs for INC-0080. Memory ramps twice: before the 04:50 restart and after it.
[[burst]]
from = "03:40:00"
to = "04:49:00"
count = 18
service = "fraud-scorer"
level = "WARN"
hosts = ["fraud-scorer-02.prod.internal"]
message = "FRD-W118 redis-features fetch exceeded budget ms={int:130-470} keys={int:4-12}"

[[burst]]
from = "03:45:00"
to = "04:38:00"
count = 8
service = "fraud-scorer"
level = "INFO"
hosts = ["fraud-scorer-02.prod.internal"]
message = "process memory rss_mib={ramp:2420-2860}"

[[line]]
at = "04:51:05"
service = "fraud-scorer"
host = "fraud-scorer-02.prod.internal"
level = "INFO"
message = "gunicorn master shutting down for rollout restart"

[[line]]
at = "04:53:30"
service = "fraud-scorer"
host = "fraud-scorer-02.prod.internal"
level = "INFO"
message = "entrypoint: WEB_CONCURRENCY unset, starting 16 gunicorn workers (cpu count)"

[[burst]]
from = "05:18:00"
to = "06:20:00"
count = 18
service = "fraud-scorer"
level = "WARN"
hosts = ["fraud-scorer-02.prod.internal"]
message = "FRD-W118 redis-features fetch exceeded budget ms={int:130-470} keys={int:4-12}"

[[burst]]
from = "05:10:00"
to = "06:25:00"
count = 8
service = "fraud-scorer"
level = "INFO"
hosts = ["fraud-scorer-02.prod.internal"]
message = "process memory since restart rss_mib={ramp:2410-2780}"

[[burst]]
from = "03:40:00"
to = "06:38:00"
count = 30
service = "payments-api"
level = "WARN"
hosts = ["payments-api-01.prod.internal", "payments-api-02.prod.internal", "payments-api-03.prod.internal", "payments-api-04.prod.internal"]
message = "PAYAPI-W0310 fraud score missed deadline, fallback rules payment_id={hex8}"

[[line]]
at = "06:31:15"
service = "fraud-scorer"
host = "fraud-scorer-02.prod.internal"
level = "INFO"
message = "gunicorn master shutting down for rollout restart"

[[line]]
at = "06:33:40"
service = "fraud-scorer"
host = "fraud-scorer-02.prod.internal"
level = "INFO"
message = "entrypoint: WEB_CONCURRENCY unset, starting 16 gunicorn workers (cpu count)"

[[burst]]
from = "06:42:00"
to = "07:04:00"
count = 10
service = "fraud-scorer"
level = "INFO"
hosts = ["fraud-scorer-01.prod.internal", "fraud-scorer-02.prod.internal"]
message = "score ok latency_ms={int:8-32}"
