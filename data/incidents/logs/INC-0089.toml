host = "kafka-01.prod.internal"
level = "INFO"
message = "ops: journal vacuumed to 500M on root disk"

[[line]]
at = "12:47:05"
service = "kafka"
host = "kafka-01.prod.internal"
level = "INFO"
message = "log-agent: offset writes resumed, shipping buffered lines"

[[line]]
at = "12:58:40"
service = "kafka"
host = "kafka-01.prod.internal"
level = "INFO"
message = "ops: SystemMaxUse=500M added to journald.conf; systemd-journald restarted"

[[burst]]
from = "12:48:00"
to = "13:45:00"
count = 14
service = "kafka"
level = "INFO"
hosts = ["kafka-01.prod.internal"]
message = "disk-monitor: root filesystem (/var) usage steady"
