# Synthetic logs for INC-0089. Fictional log-agent, disk-monitor and ops lines only; no real Kafka text.
[[burst]]
from = "11:46:00"
to = "11:54:40"
count = 5
service = "kafka"
level = "WARN"
hosts = ["kafka-01.prod.internal"]
message = "disk-monitor: root filesystem (/var) usage {ramp:97-99}%"

[[burst]]
from = "11:55:00"
to = "12:46:30"
count = 30
service = "kafka"
level = "ERROR"
hosts = ["kafka-01.prod.internal"]
message = "log-agent: write to /var/lib/log-agent/offsets failed: ENOSPC"

[[burst]]
from = "12:05:00"
