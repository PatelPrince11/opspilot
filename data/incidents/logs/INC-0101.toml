# Synthetic logs for INC-0101. OpenSearch's own lines stop while /var is full; the log agent
# ships its own errors over the network (NOTES fact).
[[burst]]
from = "05:20:00"
to = "05:29:50"
count = 10
service = "search-cluster"
level = "INFO"
hosts = ["search-cluster-02.prod.internal"]
message = "opensearch: query on index products took {int:510-990}ms (slow log)"

[[burst]]
from = "05:20:00"
to = "05:29:50"
count = 4
service = "search-cluster"
level = "WARN"
hosts = ["search-cluster-02.prod.internal"]
message = "log-agent: /var usage 99%"

[[burst]]
from = "05:30:00"
to = "06:03:59"
count = 14
service = "search-cluster"
level = "ERROR"
hosts = ["search-cluster-02.prod.internal"]
message = "log-agent: write position file under /var/lib/log-agent: no space left on device (ENOSPC)"

[[line]]
at = "06:04:40"
service = "search-cluster"
host = "search-cluster-02.prod.internal"
level = "INFO"
message = "log-agent: position writes resumed, /var usage 28%"

[[burst]]
from = "06:10:00"
to = "06:50:00"
count = 14
service = "search-cluster"
level = "INFO"
hosts = ["search-cluster-02.prod.internal"]
message = "opensearch: query on index products took {int:505-880}ms (slow log)"

[[burst]]
from = "06:05:00"
to = "06:40:00"
count = 4
service = "search-cluster"
level = "INFO"
hosts = ["search-cluster-02.prod.internal"]
message = "log-agent: backlog {ramp:5-95}% shipped"
