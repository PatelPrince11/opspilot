# Lint, tests against Postgres + pgvector, and the results-ledger check. No API keys: LLM tests
# use stubs and mocked HTTP; tests that need local-only data (LogHub lines) skip with a reason
# (shown by -rs). REQUIRE_DB=1 makes an unreachable Postgres fail the run instead of skipping.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The Makefile builds DATABASE_URL from these for host-side targets.
      DB_HOST_PORT: "5432"
      DATABASE_URL: postgresql://opspilot:change-me@localhost:5432/opspilot
      REQUIRE_DB: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # The embedder and reranker are pinned to Hugging Face commits in config.py.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('config.py') }}

      - name: Lint
        run: make lint

      - name: Migrations
        run: uv run alembic upgrade head

      # Line coverage of rag/ and agent/ (pyproject [tool.coverage]); under 85% fails the job.
      - name: Tests and coverage
        run: uv run pytest -rs --cov --cov-report=term-missing

      - name: Results ledger is current
        run: make results-check

  # The dashboard: lint, typecheck, component tests (mocked SSE) and build, then the Playwright
  # smoke test against the real API with the stub LLM (tests/e2e_server.py), which needs Postgres.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://opspilot:change-me@localhost:5432/opspilot
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Python dependencies (for the e2e server)
        run: uv sync --locked
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (stub LLM)
        run: npm run e2e

  # Production images (docs/deploy.md): the app and the Nginx proxy with the dashboard, built for
  # the EC2 instance's linux/amd64. Every run builds and checks them; only a push to main, after
  # both test jobs pass, pushes them to GHCR. No secrets are baked in: .env, .env.* and .cache
  # are in .dockerignore, a CI checkout has none of them, and the check below fails the job if
  # one reaches the image.
  image:
    needs: [ci, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: opspilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: No secrets or caches in the image
        run: |
          docker run --rm --entrypoint sh opspilot:ci -c \
            'ls -A /app; ! ls -A /app | grep -E "^\.env($|\.)" | grep -v example; [ -z "$(ls -A /app/.cache)" ]'

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/patelprince11/opspilot:latest
            ghcr.io/patelprince11/opspilot:${{ github.sha }}
          cache-from: type=gha

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/patelprince11/opspilot-proxy:latest
            ghcr.io/patelprince11/opspilot-proxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=proxy
