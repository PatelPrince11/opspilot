# Eval-only: the open demo incident INC-LIVE-001. SYNTHETIC. Never ingested as a document,
# never in incidents.jsonl, and none of the 200 incidents. Evidence lives only in the demo logs
# (data/live/INC-LIVE-001.toml -> data/processed/log_events.live.jsonl) and in the services.toml
# status snapshot. Every fact below is a NOTES Fictional fact (F1-F5, rollout tool, PgBouncer)
# or the 2026-10-11 PgBouncer 1.22 source and runtime checks; pgx's own behaviour on a failed dial is unverified
# and never relied on.

id = "INC-LIVE-001"
question = "The payment API is returning connection-refused errors. What likely happened, what evidence supports it, and what should I check next?"

# Demo guard: no document (runbook, incident row or prose) may contain all three. The demo logs
# must contain all three.
leak_combination = ["payments-pgbouncer-01", "ECONNREFUSED", "6432"]

likely_cause = "A rollout-tool run scoped to payments-pgbouncer-01 pushed a pgbouncer.ini with a misspelled pool_mode; systemctl restart pgbouncer exited 0 (unit is Type=simple), then pgbouncer refused the file at startup and exited with status 1. payments-api alternates new connections between the two bouncers with no fallback, so about half of new connections hit the closed 10.0.4.21:6432 and fail with ECONNREFUSED."

[cause]
service = "payments-pgbouncer"
host = "payments-pgbouncer-01.prod.internal"
ip = "10.0.4.21"
port = 6432
healthy_peer = "payments-pgbouncer-02.prod.internal"
trigger = "rollout-tool run scoped to payments-pgbouncer-01 only (F5), writing /etc/pgbouncer/pgbouncer.ini"
mechanism = "pool_mode = transction (misspelled) on line 11 of /etc/pgbouncer/pgbouncer.ini: PgBouncer 1.22 logs the invalid value, then dies at startup with exit status 1"
mechanism_status = "verified by running PgBouncer 1.22.1 (release tarball): ERROR line, FATAL cannot load config file, exit status 1; source pgbouncer_1_22_0 lib/usual/cfparser.c:167, src/main.c:439 (NOTES 2026-10-11)"
pgbouncer_lines = [
  'invalid value "transction" for parameter pool_mode in configuration (/etc/pgbouncer/pgbouncer.ini:11)',
  "cannot load config file",
]
systemd_line = "pgbouncer.service: Main process exited, code=exited, status=1/FAILURE"

[bouncer_selection]
# F1: alternate per new connection, no fallback (not built). Only F1 and F2 are relied on.
policy = "alternate per new connection, no fallback"
normal_split = "about half each: 4 x 40 = 160 client connections, about 80 per bouncer"
log_errno_field = "errno=ECONNREFUSED"  # F2: our logger's field; Go itself prints "connection refused"
no_payapi_e1042 = true  # the connect is refused at once; nothing waits on DB_ACQUIRE_TIMEOUT=500ms

[timeline]  # UTC
date = 2026-10-06
run_started = "14:30:00"
config_written = "14:30:39"
restart_exit_0 = "14:30:40"
pgbouncer_exited = "14:30:41"
first_refused = "14:30:42"
paged = "14:38:00"
snapshot = "14:52:00"
full_run_would_have_reached_02 = "14:35:00"  # older pacing: fixed 5 min; did not happen (run scoped to -01)

[binding_constraint]
gate_live_since = 2026-08-20
pgbouncer_enrolled = false
pacing = "older: canary, fixed 5-minute wait, only the exit status of systemctl restart (RB-027)"
run_scope = ["payments-pgbouncer-01.prod.internal"]  # F5: runs can be scoped to a subset
unit_type = "Type=simple"  # F3: restart exits 0 even though pgbouncer dies a second later
journal_identifier = "rollout"  # F4
after_last_incident = true  # every skeleton row starts before 2026-10-01
after_last_runbook_review = "2026-09-29"  # RB-029
service_status = "unchanged from services.toml: payments-api degraded; payments-pgbouncer degraded; payments-db healthy; search-api degraded"

[distractor]
service = "search-api"
since = "13:10"
reason = "expensive /search queries (RB-003 pattern); slow-query WARNs and occasional SRCH-E502"
near_miss_runbooks = ["RB-003", "RB-014"]

[evidence]
# Log lines that carry the answer, in the order a responder should find them.
log_chain = [
  "payments-api-01..04: new connection to payments-pgbouncer-01.prod.internal (10.0.4.21:6432) refused, errno=ECONNREFUSED, from 14:30:42",
  "payments-api: new connections via payments-pgbouncer-02 (10.0.4.22) keep succeeding",
  "payments-pgbouncer-01 rollout: wrote /etc/pgbouncer/pgbouncer.ini at 14:30:39 (run scoped to this host)",
  "payments-pgbouncer-01 rollout: systemctl restart pgbouncer exited 0 at 14:30:40",
  'payments-pgbouncer-01 pgbouncer: invalid value "transction" for parameter pool_mode ... ; cannot load config file',
  "payments-pgbouncer-01 systemd: pgbouncer.service: Main process exited, code=exited, status=1/FAILURE",
  "payments-pgbouncer-02 and payments-db-01: normal lines throughout",
]
runbooks = ["RB-027", "RB-011"]  # config push to a VM daemon that doesn't come back; PgBouncer ops
analog_incident = "INC-0185"  # rollout push, restart exited 0, daemon quit at startup on a bad setting
related_incidents = ["INC-0025", "INC-0033", "INC-0038", "INC-0081"]  # scoped rollout pushes past a Type=simple restart (the daemon stayed up there)
contrast_incidents = ["INC-0055", "INC-0095", "INC-0026"]  # bouncer saturation/CPU: PAYAPI-E1042, never a refused connect
near_miss_runbooks = ["RB-010", "RB-012", "RB-007", "RB-020", "RB-017"]
get_service_status = "payments-api degraded; payments-pgbouncer degraded; payments-db healthy; search-api degraded"
query_logs_payments_api = "refused connects to 10.0.4.21:6432 with errno=ECONNREFUSED from all 4 pods from 14:30:42; work via 10.0.4.22 continues; no PAYAPI-E1042, no 53300"
query_logs_payments_pgbouncer = "-01: rollout lines (journal identifier rollout, F4), the pool_mode error, cannot load config file, Main process exited status=1; -02: normal stats"

key_facts = [
  "payments-pgbouncer-01 is down; payments-pgbouncer-02 is healthy",
  "the refused connections all go to 10.0.4.21:6432 (payments-pgbouncer-01)",
  "a rollout-tool run scoped to payments-pgbouncer-01 wrote /etc/pgbouncer/pgbouncer.ini at 14:30:39",
  "systemctl restart pgbouncer exited 0, but the unit is Type=simple, so that proved nothing",
  "pgbouncer rejected pool_mode value transction and exited with status 1",
  "pgbouncer is not enrolled in the 2026-08-20 rollout health gate, so only the restart exit status was checked",
  "payments-api alternates bouncers per new connection with no fallback, so about half of new connections fail",
  "payments-db is healthy; this is not pool exhaustion (no PAYAPI-E1042, no 53300)",
]

next_checks = [
  "journalctl -u pgbouncer on payments-pgbouncer-01, and the rollout journal lines (identifier rollout)",
  "diff /etc/pgbouncer/pgbouncer.ini on -01 against -02 or the previous commit (pool_mode line)",
  "push the previous pgbouncer.ini to payments-pgbouncer-01 only, then confirm systemctl is-active pgbouncer and the admin console answers",
  "do not rerun or extend the push to payments-pgbouncer-02",
  "SHOW POOLS on payments-pgbouncer-02 via the admin console while -01 is out",
  "watch payments-api errno=ECONNREFUSED lines stop after -01 is back",
  "follow-ups: enroll pgbouncer in the rollout health gate; add a client-side fallback between bouncers",
]

forbidden_claims = [
  "payments-db is the cause (disk full, 53300, max_connections)",
  "pgx or PgBouncer pool exhaustion (PAYAPI-E1042, query_wait_timeout, cl_waiting)",
  "DNS failure",
  "search-api is the cause",
  "payments-pgbouncer-02 is down or failing",
  "the rollout health gate checked or should have stopped this run",
  "systemctl restart pgbouncer failed",
  "pgx retries or fails over to the other bouncer",
  "every payments-api request fails",
]
